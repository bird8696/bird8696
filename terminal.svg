<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Security terminal animation</title>
<desc>Animated terminal window with sky blue border showing security commands</desc>
<style>
  .terminal-bg { fill: #0d1117; }
  .border-outer { fill: none; stroke: #5BA4CF; stroke-width: 3; }
  .border-inner { fill: none; stroke: #AEE8F5; stroke-width: 1; opacity: 0.4; }
  .title-bar { fill: #161b22; }
  .dot1 { fill: #ff5f57; }
  .dot2 { fill: #ffbd2e; }
  .dot3 { fill: #28ca41; }
  .title-text { fill: #7EC8E3; font-family: monospace; font-size: 12px; }
  .prompt { fill: #5BA4CF; font-family: monospace; font-size: 13px; font-weight: bold; }
  .cmd { fill: #AEE8F5; font-family: monospace; font-size: 13px; }
  .output { fill: #7EC8E3; font-family: monospace; font-size: 12px; }
  .output-dim { fill: #4a7a9b; font-family: monospace; font-size: 12px; }
  .cursor { fill: #AEE8F5; }

  .line1 { opacity: 0; animation: appear 0.1s 1.8s forwards; }
  .line2 { opacity: 0; animation: appear 0.1s 2.0s forwards; }
  .line3 { opacity: 0; animation: appear 0.1s 2.2s forwards; }
  .line4 { opacity: 0; animation: appear 0.1s 2.4s forwards; }
  .line5 { opacity: 0; animation: appear 0.1s 2.6s forwards; }
  .line6 { opacity: 0; animation: appear 0.1s 4.0s forwards; }
  .line7 { opacity: 0; animation: appear 0.1s 4.2s forwards; }
  .line8 { opacity: 0; animation: appear 0.1s 4.4s forwards; }
  .line9 { opacity: 0; animation: appear 0.1s 5.8s forwards; }
  .line10 { opacity: 0; animation: appear 0.1s 6.0s forwards; }
  .line11 { opacity: 0; animation: appear 0.1s 6.2s forwards; }

  .cmd1 { opacity: 0; animation: typing 1.2s 0.5s steps(28) forwards; }
  .cmd2 { opacity: 0; animation: typing 1.2s 3.0s steps(34) forwards; }
  .cmd3 { opacity: 0; animation: typing 1.2s 5.0s steps(38) forwards; }

  .cur1 { animation: blink 0.6s step-end infinite, fadeout 0.1s 1.8s forwards; }
  .cur2 { opacity: 0; animation: fadein 0s 3.0s forwards, blink 0.6s 3.0s step-end infinite, fadeout 0.1s 4.2s forwards; }
  .cur3 { opacity: 0; animation: fadein 0s 5.0s forwards, blink 0.6s 5.0s step-end infinite; }

  @keyframes appear  { to { opacity: 1; } }
  @keyframes fadein  { to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes blink   { 50% { opacity: 0; } }
  @keyframes typing  {
    from { opacity: 1; clip-path: inset(0 100% 0 0); }
    to   { opacity: 1; clip-path: inset(0 0%   0 0); }
  }
</style>

<!-- Terminal window -->
<rect x="20" y="20" width="640" height="340" rx="8" class="terminal-bg"/>
<rect x="20" y="20" width="640" height="340" rx="8" class="border-outer"/>
<rect x="23" y="23" width="634" height="334" rx="6" class="border-inner"/>

<!-- Title bar -->
<rect x="20" y="20" width="640" height="32" rx="8" class="title-bar"/>
<rect x="20" y="40" width="640" height="12" class="title-bar"/>
<circle cx="44" cy="36" r="6" class="dot1"/>
<circle cx="62" cy="36" r="6" class="dot2"/>
<circle cx="80" cy="36" r="6" class="dot3"/>
<text x="340" y="40" text-anchor="middle" class="title-text">bird8696 — security@kali</text>

<!-- Command 1 -->
<text x="44" y="80" class="prompt">❯</text>
<text x="58" y="80" class="cmd cmd1">python3 phishing_detector.py</text>
<rect x="58" y="67" width="8" height="15" class="cursor cur1"/>

<g class="line1"><text x="44" y="100" class="output">[*] Claude API 연결 완료</text></g>
<g class="line2"><text x="44" y="116" class="output-dim">    이메일 헤더 분석 중...</text></g>
<g class="line3"><text x="44" y="132" class="output">✅ is_phishing : true</text></g>
<g class="line4"><text x="44" y="148" class="output">🔴 risk_level  : HIGH</text></g>
<g class="line5"><text x="44" y="164" class="output-dim">    발신자 주소 위장 및 긴급성 유도 패턴 감지</text></g>

<!-- Command 2 -->
<g class="line6">
  <text x="44" y="192" class="prompt">❯</text>
  <text x="58" y="192" class="cmd cmd2">nmap -sV --script vuln 192.168.0.1</text>
  <rect x="58" y="179" width="8" height="15" class="cursor cur2"/>
</g>
<g class="line7"><text x="44" y="212" class="output">[*] Nmap 스캔 시작...</text></g>
<g class="line8"><text x="44" y="228" class="output-dim">    PORT    STATE  SERVICE   VERSION</text></g>

<!-- Command 3 -->
<g class="line9">
  <text x="44" y="256" class="prompt">❯</text>
  <text x="58" y="256" class="cmd cmd3">wireshark -i eth0 -k -f "tcp port 443"</text>
  <rect x="58" y="243" width="8" height="15" class="cursor cur3"/>
</g>
<g class="line10"><text x="44" y="276" class="output">[*] 패킷 캡처 시작 — eth0</text></g>
<g class="line11"><text x="44" y="292" class="output-dim">    443/tcp TLSv1.3 트래픽 감지 중...</text></g>
</svg>
